<svg xmlns="http://www.w3.org/2000/svg" width="960" height="694" viewBox="0 0 960 694" font-family="Helvetica, Arial, 'Segoe UI', sans-serif"><defs><marker id="m1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="meb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="m0b0b0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="m6250d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="me34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m0d7a53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d7a53"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="16" font-weight="bold" font-style="normal" fill="#e34948" text-anchor="start">Threat to validity</text>
<text x="356" y="28" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Spock concept — in the skill's own words</text>
<rect x="12" y="42" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="42" width="4" height="92" fill="#e34948"/>
<text x="28" y="72" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Facts from model memory</text>
<text x="28" y="96.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">gene names, values and experiments</text>
<text x="28" y="113.92" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">recalled, not queried</text>
<path d="M318,88.0 L344,88.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="42" width="596" height="92" rx="8" fill="#f2f7fd" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="352" y="42" width="4" height="92" fill="#2a78d6"/>
<text x="368" y="67" font-size="16" font-weight="bold" font-style="normal" fill="#2a78d6" text-anchor="start">The KG is the sole data source</text>
<circle cx="928" cy="62" r="10.5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="66.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">1</text>
<text x="368" y="89.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Every claim must trace to a KG query. Never rely on intrinsic knowledge for</text>
<text x="368" y="106.92" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">data.”</text>
<text x="368" y="125.84" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">Rule 1 · findings tagged [KG] / [interpretation] / [gap]</text>
<rect x="12" y="142" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="142" width="4" height="92" fill="#e34948"/>
<text x="28" y="172" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Confirming the hoped-for result</text>
<text x="28" y="196.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">success criteria chosen after the data</text>
<text x="28" y="213.92000000000002" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">are seen</text>
<path d="M318,188.0 L344,188.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="142" width="596" height="92" rx="8" fill="#fef6f3" stroke="#eb6834" stroke-width="1.5"/>
<rect x="352" y="142" width="4" height="92" fill="#eb6834"/>
<text x="368" y="167" font-size="16" font-weight="bold" font-style="normal" fill="#eb6834" text-anchor="start">Pre-registered framing, locked before data</text>
<circle cx="928" cy="162" r="10.5" fill="#eb6834" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="166.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">2</text>
<text x="368" y="189.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“…a pre-registered expected-negative — a class that should not score if the</text>
<text x="368" y="206.92000000000002" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">signal is genuine.”</text>
<text x="368" y="225.84" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">Rule 8 · also a statistics plan and a named validation set</text>
<rect x="12" y="242" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="242" width="4" height="92" fill="#e34948"/>
<text x="28" y="272" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Narrated, not measured</text>
<text x="28" y="296.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">a summary says “all 5 are UP”; the</text>
<text x="28" y="313.92" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">data file disagrees</text>
<path d="M318,288.0 L344,288.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="242" width="596" height="92" rx="8" fill="#f0f7f5" stroke="#0d7a53" stroke-width="1.5"/>
<rect x="352" y="242" width="4" height="92" fill="#0d7a53"/>
<text x="368" y="267" font-size="16" font-weight="bold" font-style="normal" fill="#0d7a53" text-anchor="start">Execution separated from judgment</text>
<circle cx="928" cy="262" r="10.5" fill="#0d7a53" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="266.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">3</text>
<text x="368" y="289.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“You execute; the main thread judges. You return artifacts, not conclusions.”</text>
<text x="368" y="307.92" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">kg-coder agent · the judge reads the real files</text>
<rect x="12" y="342" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="342" width="4" height="92" fill="#e34948"/>
<text x="28" y="372" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Grading one's own story</text>
<text x="28" y="396.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">the author cannot see the holes in</text>
<text x="28" y="413.92" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">their own narrative</text>
<path d="M318,388.0 L344,388.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="342" width="596" height="92" rx="8" fill="#f6f4fd" stroke="#6250d6" stroke-width="1.5"/>
<rect x="352" y="342" width="4" height="92" fill="#6250d6"/>
<text x="368" y="367" font-size="16" font-weight="bold" font-style="normal" fill="#6250d6" text-anchor="start">Independent fresh-context critic</text>
<circle cx="928" cy="362" r="10.5" fill="#6250d6" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="366.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">4</text>
<text x="368" y="389.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“The author who wrote the story cannot reliably see its holes; a fresh reader of</text>
<text x="368" y="406.92" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">the data files can.”</text>
<text x="368" y="425.84000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">critic gate · Blockers resolved before the researcher sees the work</text>
<rect x="12" y="442" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="442" width="4" height="92" fill="#e34948"/>
<text x="28" y="472" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Overclaiming</text>
<text x="28" y="496.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">the language outruns the evidence</text>
<path d="M318,488.0 L344,488.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="442" width="596" height="92" rx="8" fill="#f0f0f0" stroke="#0b0b0b" stroke-width="1.5"/>
<rect x="352" y="442" width="4" height="92" fill="#0b0b0b"/>
<text x="368" y="467" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Describe before interpreting</text>
<circle cx="928" cy="462" r="10.5" fill="#0b0b0b" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="466.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">5</text>
<text x="368" y="489.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Words like “all”, “every”, “systematically” … require a query against the data</text>
<text x="368" y="506.92" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">file, not a heatmap glance.”</text>
<text x="368" y="525.84" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">Rule 9 · “striking”, “central finding” banned until evaluation</text>
<rect x="12" y="542" width="300" height="92" rx="8" fill="#fdf2f2" stroke="none" stroke-width="1.5"/>
<rect x="12" y="542" width="4" height="92" fill="#e34948"/>
<text x="28" y="572" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Untraceable results</text>
<text x="28" y="596.0" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">arithmetic in chat; analyses silently</text>
<text x="28" y="613.92" font-size="14" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">revised</text>
<path d="M318,588.0 L344,588.0" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#m52514e)"/>
<rect x="352" y="542" width="596" height="92" rx="8" fill="#f0f0f0" stroke="#0b0b0b" stroke-width="1.5"/>
<rect x="352" y="542" width="4" height="92" fill="#0b0b0b"/>
<text x="368" y="567" font-size="16" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="start">Scripts and a complete history</text>
<circle cx="928" cy="562" r="10.5" fill="#0b0b0b" stroke="#fff" stroke-width="1.5"/>
<text x="928" y="566.5" font-size="13" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">6</text>
<text x="368" y="589.0" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Chat-computed statistics are unreproducible — they can't be rerun, verified, or</text>
<text x="368" y="606.92" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">shared.”</text>
<text x="368" y="625.84" font-size="13" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="start">Rule 5 · every iteration committed, never amended</text>
<rect x="12" y="646" width="936" height="38" rx="19" fill="#fdf3ef" stroke="#eb6834" stroke-width="1.5"/>
<text x="480.0" y="670" font-size="14" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="middle">Throughout: the researcher agrees each step's scope and approves it; the assistant never closes a step alone.</text></svg>