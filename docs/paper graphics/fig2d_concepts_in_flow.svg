<text x="472.0" y="465" font-size="14" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">Researcher agrees each step's scope before, and approves it after</text>
<rect x="12" y="484" width="920" height="28" rx="14" fill="#0b0b0b" stroke="none" stroke-width="1.5"/>
<text x="472.0" y="503" font-size="14" font-weight="bold" font-style="normal" fill="#fff" text-anchor="middle">Every step scripted and committed; nothing amended or overwritten</text>
<text x="472.0" y="534" font-size="13" font-weight="normal" font-style="italic" fill="#52514e" text-anchor="middle">Corrections loop back openly; the locked framing changes only by a recorded reopen.</text></svg>