<svg xmlns="http://www.w3.org/2000/svg" width="960" height="579" viewBox="0 0 960 579" font-family="Helvetica, Arial, 'Segoe UI', sans-serif"><defs><marker id="me34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="mb0397a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0397a"/></marker><marker id="m8a6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6200"/></marker><marker id="m6250d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m4a5a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a6c"/></marker><marker id="m0b7f99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f99"/></marker><marker id="m52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m0b0b0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="m1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="meb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="m0d7a53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d7a53"/></marker><marker id="m2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="12" y="22" width="936" height="534.5600000000001" rx="18" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
<rect x="34" y="9" width="482.64000000000004" height="26" rx="13" fill="#fceae3" stroke="#eb6834" stroke-width="1.5"/>
<text x="275.32000000000005" y="27" font-size="14" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="middle">The researcher approves every step; the AI never moves on alone</text>
<rect x="705.44" y="543.5600000000001" width="220.56" height="26" rx="13" fill="#fceae3" stroke="#eb6834" stroke-width="1.5"/>
<text x="815.72" y="561.5600000000001" font-size="14" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="middle">Everything is on the record</text>
<rect x="665.0" y="13" width="261.0" height="18" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="795.5" y="26.5" font-size="13" font-weight="normal" font-style="italic" fill="#52514e" text-anchor="middle">quotes: Spock’s instructions to the AI</text>
<rect x="28.0" y="48" width="293.3333333333333" height="226.96" rx="8" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<rect x="32.0" y="48" width="289.3333333333333" height="226.96" rx="8" fill="#f2f7fd" stroke="none" stroke-width="1.5"/>
<rect x="28.0" y="48" width="293.3333333333333" height="226.96" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44.0" y="68" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">PLAN</text>
<g fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="292.3333333333333" cy="63" rx="7.5" ry="3"/><path d="M284.8333333333333,63 V76 a7.5,3 0 0 0 9,2.9"/><path d="M299.8333333333333,63 V67"/><path d="M284.8333333333333,69.5 a7.5,3 0 0 0 9,2.9"/></g><circle cx="299.3333333333333" cy="73" r="5" fill="#fff" stroke="#2a78d6" stroke-width="2"/><path d="M302.8333333333333,76.5 L306.8333333333333,80.5" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="44.0" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#2a78d6" text-anchor="start">Look it up</text>
<text x="44.0" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: guessing — facts recalled, not</text>
<text x="44.0" y="128.64" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">looked up</text>
<text x="44.0" y="151.27999999999997" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“Every claim traces to a KG query.</text>
<text x="44.0" y="169.2" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Never take data from memory.”</text>
<path d="M44.0,181.12 H305.3333333333333" stroke="#aac9ef" stroke-width="1"/>
<text x="44.0" y="199.12" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Each finding is tagged: from the KG,</text>
<text x="44.0" y="215.76" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">interpretation, or a gap.</text>
<rect x="333.3333333333333" y="48" width="293.3333333333333" height="226.96" rx="8" fill="#0b7f99" stroke="none" stroke-width="1.5"/>
<rect x="337.3333333333333" y="48" width="289.3333333333333" height="226.96" rx="8" fill="#f0f7f9" stroke="none" stroke-width="1.5"/>
<rect x="333.3333333333333" y="48" width="293.3333333333333" height="226.96" rx="8" fill="none" stroke="#0b7f99" stroke-width="1.5"/>
<text x="349.3333333333333" y="68" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">PLAN</text>
<g fill="#0b7f99"><rect x="591.6666666666666" y="71" width="4.5" height="8"/><rect x="598.6666666666666" y="65" width="4.5" height="14"/><rect x="605.6666666666666" y="60" width="4.5" height="19"/></g><path d="M589.6666666666666,80.5 H611.6666666666666" fill="none" stroke="#0b7f99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="349.3333333333333" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#0b7f99" text-anchor="start">Scope first</text>
<text x="349.3333333333333" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: the plan outruns the data —</text>
<text x="349.3333333333333" y="128.64" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">criteria set for data that can't deliver</text>
<text x="349.3333333333333" y="145.27999999999997" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">them</text>
<text x="349.3333333333333" y="167.91999999999996" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“… a throwaway test … of what the</text>
<text x="349.3333333333333" y="185.83999999999997" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">data and annotations can actually</text>
<text x="349.3333333333333" y="203.76" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">tell apart.”</text>
<path d="M349.3333333333333,215.68 H610.6666666666666" stroke="#9dccd6" stroke-width="1"/>
<text x="349.3333333333333" y="233.68" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Data, annotations and controls are</text>
<text x="349.3333333333333" y="250.32" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">checked before the criteria are set.</text>
<rect x="638.6666666666666" y="48" width="293.3333333333333" height="226.96" rx="8" fill="#4a5a6c" stroke="none" stroke-width="1.5"/>
<rect x="642.6666666666666" y="48" width="289.3333333333333" height="226.96" rx="8" fill="#f4f5f6" stroke="none" stroke-width="1.5"/>
<rect x="638.6666666666666" y="48" width="293.3333333333333" height="226.96" rx="8" fill="none" stroke="#4a5a6c" stroke-width="1.5"/>
<text x="654.6666666666666" y="68" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">PLAN</text>
<g fill="none" stroke="#4a5a6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="897.0" y="61" width="16" height="20" rx="2"/><rect x="901.0" y="59" width="8" height="4" rx="1" fill="#fff"/><path d="M901.0,68 H909.0 M901.0,72 H905.0"/><path d="M910.0,73 V71 a3,3 0 0 1 6,0 V73" fill="#fff"/></g><rect x="908.0" y="73" width="10" height="8" rx="1.5" fill="#4a5a6c"/>
<text x="654.6666666666666" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#4a5a6c" text-anchor="start">Pre-register the test</text>
<text x="654.6666666666666" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: a test that can't fail — any</text>
<text x="654.6666666666666" y="128.64" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">outcome can pass</text>
<text x="654.6666666666666" y="151.27999999999997" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“Without both kinds [positive and</text>
<text x="654.6666666666666" y="169.2" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">negative controls], a true null and a</text>
<text x="654.6666666666666" y="187.12" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">blind method look the same.”</text>
<path d="M654.6666666666666,199.04000000000002 H916.0" stroke="#b7bdc4" stroke-width="1"/>
<text x="654.6666666666666" y="217.04000000000002" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Controls and decision rule fixed before</text>
<text x="654.6666666666666" y="233.68" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">the answer is seen (Fig. 2B).</text>
<rect x="28.0" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="#0d7a53" stroke="none" stroke-width="1.5"/>
<rect x="32.0" y="286.96000000000004" width="289.3333333333333" height="243.60000000000002" rx="8" fill="#f0f7f5" stroke="none" stroke-width="1.5"/>
<rect x="28.0" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="none" stroke="#0d7a53" stroke-width="1.5"/>
<text x="44.0" y="306.96000000000004" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">BUILD</text>
<g fill="none" stroke="#0d7a53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M289.3333333333333,298.96000000000004 H297.3333333333333 M291.3333333333333,298.96000000000004 V305.96000000000004 L285.3333333333333,317.96000000000004 a1.5,1.5 0 0 0 1.4,2 H295.3333333333333 M295.3333333333333,298.96000000000004 V305.96000000000004 L297.3333333333333,309.96000000000004"/></g><circle cx="301.3333333333333" cy="314.96000000000004" r="6" fill="#0d7a53"/><path d="M298.3333333333333,314.96000000000004 L300.5333333333333,317.16 L304.3333333333333,312.76000000000005" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44.0" y="330.96000000000004" font-size="17" font-weight="bold" font-style="normal" fill="#0d7a53" text-anchor="start">Check the computation</text>
<text x="44.0" y="350.96000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: silent errors in method or</text>
<text x="44.0" y="367.6" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">statistics — tests pass, real data</text>
<text x="44.0" y="384.24" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">breaks it</text>
<text x="44.0" y="406.88" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“Toy tests catch logic errors; only</text>
<text x="44.0" y="424.8" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">an independent path catches wrong</text>
<text x="44.0" y="442.72" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">calls, defaults, filters and paging.”</text>
<path d="M44.0,454.64000000000004 H305.3333333333333" stroke="#9ecaba" stroke-width="1"/>
<text x="44.0" y="472.64000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Toy data, an independent answer and a</text>
<text x="44.0" y="489.28000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">code review; correct background and</text>
<text x="44.0" y="505.92" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">multiple-testing correction.</text>
<rect x="333.3333333333333" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="#6250d6" stroke="none" stroke-width="1.5"/>
<rect x="337.3333333333333" y="286.96000000000004" width="289.3333333333333" height="243.60000000000002" rx="8" fill="#f6f4fd" stroke="none" stroke-width="1.5"/>
<rect x="333.3333333333333" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="none" stroke="#6250d6" stroke-width="1.5"/>
<text x="349.3333333333333" y="306.96000000000004" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">ANALYSE</text>
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="592.6666666666666" cy="304.96000000000004" r="3"/><path d="M588.6666666666666,317.96000000000004 V313.96000000000004 a4,4 0 0 1 8,0 V317.96000000000004"/></g>
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="600.6666666666666" cy="304.96000000000004" r="3"/><path d="M596.6666666666666,317.96000000000004 V313.96000000000004 a4,4 0 0 1 8,0 V317.96000000000004"/></g>
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="608.6666666666666" cy="304.96000000000004" r="3"/><path d="M604.6666666666666,317.96000000000004 V313.96000000000004 a4,4 0 0 1 8,0 V317.96000000000004"/></g>
<text x="349.3333333333333" y="330.96000000000004" font-size="17" font-weight="bold" font-style="normal" fill="#6250d6" text-anchor="start">Separate the roles</text>
<text x="349.3333333333333" y="350.96000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: grading your own work — the</text>
<text x="349.3333333333333" y="367.6" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">author misses their own holes</text>
<text x="349.3333333333333" y="390.24" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“You execute; the main thread judges.</text>
<text x="349.3333333333333" y="408.16" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">You return artifacts, not</text>
<text x="349.3333333333333" y="426.08000000000004" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">conclusions.”</text>
<path d="M349.3333333333333,438.00000000000006 H610.6666666666666" stroke="#c0b9ef" stroke-width="1"/>
<text x="349.3333333333333" y="456.00000000000006" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">One AI runs the code, another judges the</text>
<text x="349.3333333333333" y="472.64000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">output, a third, new to the work,</text>
<text x="349.3333333333333" y="489.28000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">reviews.</text>
<rect x="638.6666666666666" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="#8a6200" stroke="none" stroke-width="1.5"/>
<rect x="642.6666666666666" y="286.96000000000004" width="289.3333333333333" height="243.60000000000002" rx="8" fill="#f8f6f0" stroke="none" stroke-width="1.5"/>
<rect x="638.6666666666666" y="286.96000000000004" width="293.3333333333333" height="243.60000000000002" rx="8" fill="none" stroke="#8a6200" stroke-width="1.5"/>
<text x="654.6666666666666" y="306.96000000000004" font-size="13" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="start">WRITE UP</text>
<g fill="none" stroke="#8a6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M906.0,299.96000000000004 V318.96000000000004 M901.0,318.96000000000004 H911.0 M897.0,302.96000000000004 H915.0 M897.0,302.96000000000004 L894.0,310.96000000000004 M897.0,302.96000000000004 L900.0,310.96000000000004 M915.0,302.96000000000004 L912.0,310.96000000000004 M915.0,302.96000000000004 L918.0,310.96000000000004"/><path d="M894.0,310.96000000000004 a3,2.5 0 0 0 6,0 Z M912.0,310.96000000000004 a3,2.5 0 0 0 6,0 Z" fill="#8a6200"/></g>
<text x="654.6666666666666" y="330.96000000000004" font-size="17" font-weight="bold" font-style="normal" fill="#8a6200" text-anchor="start">Claims match evidence</text>
<text x="654.6666666666666" y="350.96000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: narrative fabrication — the</text>
<text x="654.6666666666666" y="367.6" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">wording outruns the evidence</text>
<text x="654.6666666666666" y="390.24" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">“‘All’, ‘every’, ‘none’, ‘primarily’</text>
<text x="654.6666666666666" y="408.16" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">need a query against the data file,</text>
<text x="654.6666666666666" y="426.08000000000004" font-size="14" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">not a glance at a heatmap.”</text>
<path d="M654.6666666666666,438.00000000000006 H916.0" stroke="#d0c099" stroke-width="1"/>
<text x="654.6666666666666" y="456.00000000000006" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Numbers first, interpretation after;</text>
<text x="654.6666666666666" y="472.64000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">each finding set against other KG</text>
<text x="654.6666666666666" y="489.28000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">studies.</text></svg>