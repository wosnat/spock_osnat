<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" font-family="Helvetica, Arial, 'Segoe UI', sans-serif"><defs><marker id="m0b0b0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="m0b7f99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f99"/></marker><marker id="m0d7a53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d7a53"/></marker><marker id="m1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m4a5a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a6c"/></marker><marker id="m52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m6250d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m8a6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6200"/></marker><marker id="mb0397a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0397a"/></marker><marker id="me34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="meb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="12" y="22" width="936" height="468.0" rx="18" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
<rect x="34" y="9" width="482.64000000000004" height="26" rx="13" fill="#fceae3" stroke="#eb6834" stroke-width="1.5"/>
<text x="275.32000000000005" y="27" font-size="14" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="middle">The researcher approves every step; the AI never moves on alone</text>
<rect x="705.44" y="477.0" width="220.56" height="26" rx="13" fill="#fceae3" stroke="#eb6834" stroke-width="1.5"/>
<text x="815.72" y="495.0" font-size="14" font-weight="bold" font-style="normal" fill="#0b0b0b" text-anchor="middle">Everything is on the record</text>
<rect x="665.0" y="13" width="261.0" height="18" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="795.5" y="26.5" font-size="13" font-weight="normal" font-style="italic" fill="#52514e" text-anchor="middle">quotes: Spock’s instructions to the AI</text>
<rect x="28.0" y="48" width="293.3333333333333" height="193.68" rx="8" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<rect x="32.0" y="48" width="289.3333333333333" height="193.68" rx="8" fill="#f2f7fd" stroke="none" stroke-width="1.5"/>
<rect x="28.0" y="48" width="293.3333333333333" height="193.68" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44.0" y="68" font-size="13" letter-spacing="1.2" fill="#52514e">PLAN</text>
<g transform="translate(272.5333333333333,60) scale(1.45)">
<g fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="5" rx="7.5" ry="3"/><path d="M1.5,5 V18 a7.5,3 0 0 0 9,2.9"/><path d="M16.5,5 V9"/><path d="M1.5,11.5 a7.5,3 0 0 0 9,2.9"/></g><circle cx="16" cy="15" r="5" fill="#fff" stroke="#2a78d6" stroke-width="2"/><path d="M19.5,18.5 L23.5,22.5" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
</g>
<text x="44.0" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#2a78d6" text-anchor="start">Look it up</text>
<text x="44.0" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: guessing</text>
<text x="44.0" y="134.64" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Never take data from memory … When</text>
<text x="44.0" y="152.56" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">the KG can’t answer, say so and log</text>
<text x="44.0" y="170.48000000000002" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">it as a gap.”</text>
<path d="M44.0,182.40000000000003 H305.3333333333333" stroke="#aac9ef" stroke-width="1"/>
<text x="44.0" y="200.40000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Each finding is tagged: from the KG,</text>
<text x="44.0" y="217.04000000000002" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">interpretation, or a gap.</text>
<rect x="333.3333333333333" y="48" width="293.3333333333333" height="193.68" rx="8" fill="#0b7f99" stroke="none" stroke-width="1.5"/>
<rect x="337.3333333333333" y="48" width="289.3333333333333" height="193.68" rx="8" fill="#f0f7f9" stroke="none" stroke-width="1.5"/>
<rect x="333.3333333333333" y="48" width="293.3333333333333" height="193.68" rx="8" fill="none" stroke="#0b7f99" stroke-width="1.5"/>
<text x="349.3333333333333" y="68" font-size="13" letter-spacing="1.2" fill="#52514e">PLAN</text>
<g transform="translate(577.8666666666667,60) scale(1.45)">
<g fill="#0b7f99"><rect x="3" y="13" width="4.5" height="8"/><rect x="10" y="7" width="4.5" height="14"/><rect x="17" y="2" width="4.5" height="19"/></g><path d="M1,22.5 H23" fill="none" stroke="#0b7f99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="349.3333333333333" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#0b7f99" text-anchor="start">Scope first</text>
<text x="349.3333333333333" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: the plan outruns the data</text>
<text x="349.3333333333333" y="134.64" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“… a throwaway test … of what the</text>
<text x="349.3333333333333" y="152.56" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">data and annotations can actually</text>
<text x="349.3333333333333" y="170.48000000000002" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">tell apart.”</text>
<path d="M349.3333333333333,182.40000000000003 H610.6666666666666" stroke="#9dccd6" stroke-width="1"/>
<text x="349.3333333333333" y="200.40000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Data, annotations and controls are checked</text>
<text x="349.3333333333333" y="217.04000000000002" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">before the criteria are set.</text>
<rect x="638.6666666666666" y="48" width="293.3333333333333" height="193.68" rx="8" fill="#4a5a6c" stroke="none" stroke-width="1.5"/>
<rect x="642.6666666666666" y="48" width="289.3333333333333" height="193.68" rx="8" fill="#f4f5f6" stroke="none" stroke-width="1.5"/>
<rect x="638.6666666666666" y="48" width="293.3333333333333" height="193.68" rx="8" fill="none" stroke="#4a5a6c" stroke-width="1.5"/>
<text x="654.6666666666666" y="68" font-size="13" letter-spacing="1.2" fill="#52514e">PLAN</text>
<g transform="translate(883.2,60) scale(1.45)">
<g fill="none" stroke="#4a5a6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="16" height="20" rx="2"/><rect x="7" y="1" width="8" height="4" rx="1" fill="#fff"/><path d="M7,10 H15 M7,14 H11"/><path d="M16,15 V13 a3,3 0 0 1 6,0 V15" fill="#fff"/></g><rect x="14" y="15" width="10" height="8" rx="1.5" fill="#4a5a6c"/>
</g>
<text x="654.6666666666666" y="92" font-size="17" font-weight="bold" font-style="normal" fill="#4a5a6c" text-anchor="start">Pre-register the test</text>
<text x="654.6666666666666" y="112" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: a test that can't fail</text>
<text x="654.6666666666666" y="134.64" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Without both kinds [positive and</text>
<text x="654.6666666666666" y="152.56" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">negative controls], a true null and a</text>
<text x="654.6666666666666" y="170.48000000000002" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">blind method look the same.”</text>
<path d="M654.6666666666666,182.40000000000003 H916.0" stroke="#b7bdc4" stroke-width="1"/>
<text x="654.6666666666666" y="200.40000000000003" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Controls and decision rule fixed before the</text>
<text x="654.6666666666666" y="217.04000000000002" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">answer is seen (Fig. 2B).</text>
<rect x="28.0" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="#0d7a53" stroke="none" stroke-width="1.5"/>
<rect x="32.0" y="253.68" width="289.3333333333333" height="210.32" rx="8" fill="#f0f7f5" stroke="none" stroke-width="1.5"/>
<rect x="28.0" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="none" stroke="#0d7a53" stroke-width="1.5"/>
<text x="44.0" y="273.68" font-size="13" letter-spacing="1.2" fill="#52514e">RUN</text>
<g transform="translate(272.5333333333333,265.68) scale(1.45)">
<g fill="none" stroke="#0d7a53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6,2 H14 M8,2 V9 L2,21 a1.5,1.5 0 0 0 1.4,2 H12 M12,2 V9 L14,13"/></g><circle cx="18" cy="18" r="6" fill="#0d7a53"/><path d="M15,18 L17.2,20.2 L21,15.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="44.0" y="297.68" font-size="17" font-weight="bold" font-style="normal" fill="#0d7a53" text-anchor="start">Check the computation</text>
<text x="44.0" y="317.68" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: silent errors</text>
<text x="44.0" y="340.32" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“Toy tests catch logic errors; only</text>
<text x="44.0" y="358.24" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">an independent path catches wrong</text>
<text x="44.0" y="376.16" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">calls, defaults, filters and paging.”</text>
<path d="M44.0,388.08000000000004 H305.3333333333333" stroke="#9ecaba" stroke-width="1"/>
<text x="44.0" y="406.08000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Toy data, an independent answer and a code</text>
<text x="44.0" y="422.72" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">review; correct background and</text>
<text x="44.0" y="439.36" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">multiple-testing correction.</text>
<rect x="333.3333333333333" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="#8a6200" stroke="none" stroke-width="1.5"/>
<rect x="337.3333333333333" y="253.68" width="289.3333333333333" height="210.32" rx="8" fill="#f8f6f0" stroke="none" stroke-width="1.5"/>
<rect x="333.3333333333333" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="none" stroke="#8a6200" stroke-width="1.5"/>
<text x="349.3333333333333" y="273.68" font-size="13" letter-spacing="1.2" fill="#52514e">RUN</text>
<g transform="translate(577.8666666666667,265.68) scale(1.45)">
<g fill="none" stroke="#8a6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3 V22 M7,22 H17 M3,6 H21 M3,6 L0,14 M3,6 L6,14 M21,6 L18,14 M21,6 L24,14"/><path d="M0,14 a3,2.5 0 0 0 6,0 Z M18,14 a3,2.5 0 0 0 6,0 Z" fill="#8a6200"/></g>
</g>
<text x="349.3333333333333" y="297.68" font-size="17" font-weight="bold" font-style="normal" fill="#8a6200" text-anchor="start">Claims match evidence</text>
<text x="349.3333333333333" y="317.68" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: narrative fabrication</text>
<text x="349.3333333333333" y="340.32" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“[Words like] ‘every’, ‘none’ … need</text>
<text x="349.3333333333333" y="358.24" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">a query against the data file, not a</text>
<text x="349.3333333333333" y="376.16" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">glance at a heatmap.”</text>
<path d="M349.3333333333333,388.08000000000004 H610.6666666666666" stroke="#d0c099" stroke-width="1"/>
<text x="349.3333333333333" y="406.08000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">Numbers first, interpretation after; each</text>
<text x="349.3333333333333" y="422.72" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">finding set against other KG studies.</text>
<rect x="638.6666666666666" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="#6250d6" stroke="none" stroke-width="1.5"/>
<rect x="642.6666666666666" y="253.68" width="289.3333333333333" height="210.32" rx="8" fill="#f6f4fd" stroke="none" stroke-width="1.5"/>
<rect x="638.6666666666666" y="253.68" width="293.3333333333333" height="210.32" rx="8" fill="none" stroke="#6250d6" stroke-width="1.5"/>
<text x="654.6666666666666" y="273.68" font-size="13" letter-spacing="1.2" fill="#52514e">RUN</text>
<g transform="translate(883.2,265.68) scale(1.45)">
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="8" r="3"/><path d="M0,21 V17 a4,4 0 0 1 8,0 V21"/></g>
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M8,21 V17 a4,4 0 0 1 8,0 V21"/></g>
<g fill="none" stroke="#6250d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="8" r="3"/><path d="M16,21 V17 a4,4 0 0 1 8,0 V21"/></g>
</g>
<text x="654.6666666666666" y="297.68" font-size="17" font-weight="bold" font-style="normal" fill="#6250d6" text-anchor="start">Separate the roles</text>
<text x="654.6666666666666" y="317.68" font-size="13" font-weight="normal" font-style="normal" fill="#b3261e" text-anchor="start">against: grading your own work</text>
<text x="654.6666666666666" y="340.32" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">“You execute; the main thread judges.</text>
<text x="654.6666666666666" y="358.24" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">You return artifacts, not</text>
<text x="654.6666666666666" y="376.16" font-size="14" font-weight="normal" font-style="italic" fill="#0b0b0b" text-anchor="start">conclusions.”</text>
<path d="M654.6666666666666,388.08000000000004 H916.0" stroke="#c0b9ef" stroke-width="1"/>
<text x="654.6666666666666" y="406.08000000000004" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">One AI runs the code, another judges the</text>
<text x="654.6666666666666" y="422.72" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">output, a third, new to the work, reviews.</text></svg>