<text x="20" y="234" font-size="15" font-weight="bold" font-style="normal" fill="#2a78d6" text-anchor="start">Grounded scope</text>
<text x="20" y="254" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">the question is sized to what</text>
<text x="20" y="270" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">the KG actually holds, not to</text>
<text x="20" y="286" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">memory</text>
