<text x="240" y="272" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">a validation set must score</text>
<text x="240" y="288" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">and an expected-negative</text>
<text x="240" y="304" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">must not, so a null result</text>
<text x="240" y="320" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">stays interpretable</text>
<rect x="442" y="212" width="112" height="124" rx="8" fill="#f0f6fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="450" y="234" font-size="15" font-weight="bold" font-style="normal" fill="#2a78d6" text-anchor="start">Fresh eyes</text>
<text x="450" y="254" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">a critic who</text>
<text x="450" y="270" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">did not write</text>
<text x="450" y="286" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">the plan, then</text>
<text x="450" y="302" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b" text-anchor="start">the researcher</text>
